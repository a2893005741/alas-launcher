name: Package WarshipPilot
on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: WarshipPilot commit or branch
        default: main
        required: true
      publish:
        description: Publish assets and stable manifest
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: warship-release-manifest
  cancel-in-progress: false
env:
  AZURPILOT_LOG_MASK_B64: 
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Register log masks
        shell: pwsh
        run: |
          $masks=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:AZURPILOT_LOG_MASK_B64))
          $masks -split "`n" | ForEach-Object { if ($_.Trim()) { Write-Output "::add-mask::$($_.Trim())" } }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/checkout@v4
        with:
          repository: a2893005741/WarshipPilot
          ref: ${{ inputs.backend_ref }}
          path: backend
      - uses: astral-sh/setup-uv@v6
      - name: Verify launcher
        shell: pwsh
        run: |
          npm.cmd --prefix frontend ci 2>&1 | ForEach-Object { "$_" -replace 'https?://\S+', '<URL>' }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p "test_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --all-targets
          exit $LASTEXITCODE
      - name: Build release and fixed-commit components
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $env:AZURPILOT_BOOTSTRAP_UV=(Get-Command uv).Source
          cargo build --locked --release --features custom-protocol
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build_components.py --source backend --output release --platform windows-x86_64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/prepare_release.py --output release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/package_launcher.py
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: WarshipPilot-Windows-x64
          path: |
            release/*
            WarshipPilot-Windows-x86_64.zip
      - name: Publish assets before manifest
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view runtime *> $null
          if ($LASTEXITCODE) { gh release create runtime --title 'Runtime components' --notes 'Content-addressed Git and ADB' }
          gh release upload runtime release/component-*.zip --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version=(Get-Content tauri.conf.json | ConvertFrom-Json).version
          gh release view "v$version" *> $null
          if ($LASTEXITCODE) { gh release create "v$version" --title "舰R助手启动器 $version" --notes-file docs/release-notes.md }
          gh release upload "v$version" release/WarshipPilot.exe WarshipPilot-Windows-x86_64.zip --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release view manifest *> $null
          if ($LASTEXITCODE) { gh release create manifest --title 'Stable manifest' --notes 'Fixed-commit deployment metadata' }
          gh release upload manifest release/stable.json --clobber
          exit $LASTEXITCODE
