name: Test WarshipPilot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
env:
  AZURPILOT_LOG_MASK_B64: 
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Register log masks
        shell: pwsh
        run: |
          $masks=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:AZURPILOT_LOG_MASK_B64))
          $masks -split "`n" | ForEach-Object { if ($_.Trim()) { Write-Output "::add-mask::$($_.Trim())" } }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify launcher
        shell: pwsh
        run: |
          npm.cmd --prefix frontend ci 2>&1 | ForEach-Object { "$_" -replace 'https?://\S+', '<URL>' }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p "test_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --all-targets
          exit $LASTEXITCODE
